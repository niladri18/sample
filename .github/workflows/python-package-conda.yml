# CI/CD workflow to run and test bell_rotation via test_function.py
name: Test bell_rotation

on:
  push:
    branches: [main, master]
    paths:
      - 'bell_rotation.py'
      - 'test_function.py'
      - 'requirements_optimized.txt'
      - '.github/workflows/test_bell_rotation.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'bell_rotation.py'
      - 'test_function.py'
      - 'requirements_optimized.txt'
      - '.github/workflows/test_bell_rotation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
          matrix:
           python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_optimized.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_optimized.txt
          pip install pytest

      - name: Run test_function.py tests
        run: pytest test_function.py -v
